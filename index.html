<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wwizzer — био</title>
<meta name="description" content="Ванек aka wwizzer — социальный инженер, инженер по генеративной разработке.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070a;
    --glass: rgba(20, 16, 34, .38);
    --glass-strong: rgba(24, 18, 42, .55);
    --stroke: rgba(180, 140, 255, .22);
    --text: #ececf2;
    --muted: #a49ab8;
    --accent: #b48cff;
    --accent2: #d9b3ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
  }

  ::selection { background: rgba(180,140,255,.35); }

  /* ============ КАРТОЧКА ============ */
  .card {
    position: relative;
    width: min(420px, 100%);
    border-radius: 30px;
    overflow: hidden;
    border: 1px solid rgba(180,140,255,.16);
    box-shadow:
      0 30px 80px rgba(0,0,0,.65),
      inset 0 1px 0 rgba(255,255,255,.08);
    isolation: isolate;
    opacity: 0;
    transform: translateY(14px);
    animation: cardIn .8s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes cardIn { to { opacity: 1; transform: none; } }

  .card-bg {
    position: absolute; inset: 0;
    background: url('assets/forest.jpg') center / cover no-repeat;
    z-index: -2;
  }
  .card-bg::after {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(10,7,18,.25) 0%, rgba(10,7,18,.45) 55%, rgba(8,6,14,.72) 100%),
      radial-gradient(120% 60% at 50% 0%, rgba(124,80,220,.10), transparent 60%);
  }

  .inner {
    position: relative;
    padding: 64px 26px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* падающее: снег + слова */
  .fall-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
  .fall {
    position: absolute; top: -12%;
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap; user-select: none;
    color: rgba(217, 179, 255, .13);
    text-shadow: 0 0 14px rgba(180,140,255,.15);
    animation: fall linear infinite;
  }
  .fall.snow { font-size: 13px; color: rgba(255,255,255,.35); text-shadow: none; }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    8%   { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(115vh) rotate(10deg); opacity: 0; }
  }

  /* glass-хелпер */
  .glass {
    background: var(--glass);
    border: 1px solid var(--stroke);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
  }

  /* счётчик */
  .views {
    position: absolute; top: 14px; right: 14px;
    z-index: 5;
    display: flex; align-items: center; gap: 7px;
    padding: 6px 12px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--muted);
  }
  .views img { height: 12px; display: block; opacity: .85; }

  /* аватар */
  .avatar-wrap { position: relative; margin-bottom: 18px; }
  .avatar {
    width: 128px; height: 128px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(217,179,255,.35);
    box-shadow:
      0 0 0 6px rgba(124,80,220,.12),
      0 0 46px rgba(148, 100, 255, .38),
      inset 0 0 18px rgba(0,0,0,.5);
    display: block;
  }
  .avatar-ring {
    position: absolute; inset: -9px;
    border-radius: 50%;
    border: 1px solid rgba(217,179,255,.18);
  }

  /* имя */
  .grad {
    background: linear-gradient(90deg,
      #262033 0%, #a06bff 10%, #d9b3ff 22%, #9b6cff 35%,
      #3a2f52 47%, #262033 50%, #a06bff 60%, #d9b3ff 72%,
      #8a5cf5 85%, #262033 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: shimmer 10s linear infinite;
  }
  @keyframes shimmer {
    from { background-position: 0% 50%; }
    to   { background-position: -200% 50%; }
  }

  h1 {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -.5px;
    line-height: 1.15;
    display: flex; align-items: center; gap: 8px;
  }
  .handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    color: var(--accent2);
    opacity: .9;
    margin: 2px 0 16px;
  }

  /* бейджи-иконки */
  .badges { display: flex; gap: 10px; margin-bottom: 14px; }
  .badge {
    width: 38px; height: 38px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    transition: transform .25s, border-color .25s;
  }
  .badge:hover { transform: translateY(-3px) scale(1.06); border-color: rgba(217,179,255,.45); }

  /* чипы */
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 22px; }
  .chip {
    padding: 7px 15px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    color: #d9d2ea;
    letter-spacing: .3px;
    transition: border-color .25s, color .25s;
  }
  .chip:hover { border-color: rgba(217,179,255,.5); color: #fff; }
  .chip .dim { color: var(--muted); font-weight: 400; }

  /* список фактов */
  .facts {
    width: 100%;
    display: flex; flex-direction: column; align-items: center;
    gap: 7px;
    margin-bottom: 24px;
    font-size: 14.5px;
  }
  .facts a {
    color: var(--accent2);
    text-decoration: underline;
    text-decoration-color: rgba(217,179,255,.35);
    text-underline-offset: 3px;
    transition: color .2s;
  }
  .facts a:hover { color: #fff; }
  .facts .row { display: flex; gap: 8px; align-items: baseline; color: #cfcae0; }
  .facts .arrow { color: var(--accent); font-size: 11px; }

  /* соцсети */
  .socials { display: flex; gap: 12px; margin-bottom: 20px; }
  .soc {
    width: 46px; height: 46px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    color: #cfc6e6;
    transition: transform .25s cubic-bezier(.2,.7,.3,1), border-color .25s, color .25s, box-shadow .25s;
  }
  .soc svg { width: 21px; height: 21px; }
  .soc:hover {
    transform: translateY(-4px);
    border-color: rgba(217,179,255,.55);
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 8px 22px rgba(90, 50, 180, .35);
  }

  /* низ */
  .bottom {
    display: flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .bottom .dot { color: #4ade80; animation: blink 2s infinite; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

  /* появления */
  .rise { opacity: 0; transform: translateY(12px); animation: rise .6s cubic-bezier(.2,.7,.3,1) forwards; }
  .d1 { animation-delay: .15s } .d2 { animation-delay: .28s } .d3 { animation-delay: .4s }
  .d4 { animation-delay: .52s } .d5 { animation-delay: .64s } .d6 { animation-delay: .76s }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (max-width: 440px) {
    body { padding: 14px 10px; }
    .inner { padding: 56px 20px 22px; }
  }
</style>
</head>
